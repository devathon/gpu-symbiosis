[project]
name = "gpusybio"
version = "0.1.0"
description = "GPUSymbiosis — intelligent coexistence of AI workloads on a shared GPU"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "nvidia-ml-py>=12",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["gpusybio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
